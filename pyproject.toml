[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-watch-notifier"
version = "0.1.0"
description = "Send phone, desktop, and smartwatch notifications when local Codex tasks finish."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "codex-watch-notifier contributors" }]
keywords = ["codex", "notifications", "telegram", "smartwatch", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
codex-watch = "codex_watch.main:main"

[project.urls]
Homepage = "https://github.com/H1234L1/codex-watch-notifier"
Issues = "https://github.com/H1234L1/codex-watch-notifier/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
